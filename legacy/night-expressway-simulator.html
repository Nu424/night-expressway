import * as THREE from 'three';
import { EffectComposer } from 'three/addons/postprocessing/EffectComposer.js';
import { RenderPass } from 'three/addons/postprocessing/RenderPass.js';
import { ShaderPass } from 'three/addons/postprocessing/ShaderPass.js';
import { UnrealBloomPass } from 'three/addons/postprocessing/UnrealBloomPass.js';
import { OutputPass } from 'three/addons/postprocessing/OutputPass.js';
import { mergeGeometries } from 'three/addons/utils/BufferGeometryUtils.js';

/* ============================================================
   utilities
   ============================================================ */
const V3 = THREE.Vector3;
function mulberry32(a){return function(){a|=0;a=a+0x6D2B79F5|0;let t=Math.imul(a^a>>>15,1|a);t=t+Math.imul(t^t>>>7,61|t)^t;return((t^t>>>14)>>>0)/4294967296}}
const _seedP=new URLSearchParams(location.search).get('seed');
const SEED=_seedP?parseInt(_seedP):(Math.random()*2**31)|0;
const R = mulberry32(SEED);
const rr=(a,b)=>a+(b-a)*R();
const pick=a=>a[(R()*a.length)|0];
const clamp=(x,a,b)=>x<a?a:x>b?b:x;
const lerp=(a,b,t)=>a+(b-a)*t;
const sstep=(a,b,x)=>{const t=clamp((x-a)/(b-a),0,1);return t*t*(3-2*t)};
const FONT='"Noto Sans JP","Hiragino Sans","Yu Gothic",sans-serif';
const params=new URLSearchParams(location.search);

/* ============================================================
   global uniforms / constants
   ============================================================ */
const FOG_COLOR=new THREE.Color().setRGB(0.050,0.040,0.048);
const FOG_DENS=0.00072;
const U={
  time:{value:0}, wet:{value:0}, rain:{value:0},
  reflTex:{value:null}, texMat:{value:new THREE.Matrix4()},
  reflRoad:{value:0}, reflWater:{value:0},
  hazeCol:{value:FOG_COLOR.clone()}, haze:{value:FOG_DENS},
  blink:{value:0}, pr:{value:1},
};
const STEP=2, CH=100, SPC=CH/STEP;
const AHEAD=1600, BEHIND=200;
const LANES=[-6.25,-2.75];       // our carriageway: 0 = driving lane (left), 1 = passing lane
const LANES_OPP=[2.75,6.25];     // oncoming carriageway
const LAMP_COLORS={sodium:[1.0,0.46,0.15],warm:[1.0,0.74,0.48],white:[0.82,0.88,1.0]};
const TUNNEL_NAMES=[['山之手トンネル','YAMANOTE TUNNEL'],['臨港トンネル','RINKO TUNNEL'],['羽根田トンネル','HANETA TUNNEL'],['千代原トンネル','CHIYOHARA TUNNEL'],['大楠トンネル','OKUSU TUNNEL']];

/* ============================================================
   sections & path
   ============================================================ */
const sections=[]; let secEnd=0, lastSpecial='bay';
function addSection(){
  const prev=sections.length?sections[sections.length-1].type:null;
  let type;
  if(!prev) type='city';
  else if(prev!=='city') type='city';
  else { type = lastSpecial==='tunnel' ? (R()<0.88?'bay':'tunnel') : (R()<0.88?'tunnel':'bay'); lastSpecial=type; }
  let len;
  if(type==='city') len = prev? Math.round(rr(18,28))*100 : 2400;
  else if(type==='tunnel') len = Math.round(rr(17,24))*100;
  else len = Math.round(rr(27,32))*100;
  const sec={type,start:secEnd,len,end:secEnd+len,id:sections.length,
    baseY:rr(13,19),phase:rr(0,6.28),
    lamp: type==='city'?pick(['sodium','warm','warm','white']): type==='tunnel'?pick(['sodium','sodium','warm']):pick(['white','warm'])};
  if(type==='tunnel'){ sec.encStart=700; sec.encEnd=len-100; sec.name=pick(TUNNEL_NAMES); }
  if(type==='bay'){ const mid=Math.round(len/200)*100; sec.mid=mid; sec.t1=mid-400; sec.t2=mid+400; sec.a1=sec.t1-360; sec.a2=sec.t2+360; }
  sec.col=LAMP_COLORS[sec.lamp];
  sec.fam = type==='bay'
    ? [{sp:50,off:0,u:-2.9,h:12,I:1.4},{sp:50,off:0,u:2.9,h:12,I:1.4}]
    : [{sp:40,off:0,u:-7.3,h:10,I:1.6},{sp:40,off:20,u:7.3,h:10,I:1.6}];
  sections.push(sec); secEnd+=len;
}
let _secC=null;
function secAt(s){
  if(_secC && s>=_secC.start && s<_secC.end) return _secC;
  while(secEnd<=s+1) addSection();
  for(let i=sections.length-1;i>=0;i--) if(sections[i].start<=s){_secC=sections[i];return _secC;}
  return sections[0];
}
function isEnc(sec,ls){return sec.type==='tunnel' && ls>=sec.encStart && ls<sec.encEnd;}

const P={first:0,arr:[],h:0,k:0,kT:0,kTimer:0,x:0,z:0,y:16,slope:0};
function genSample(){
  const i=P.first+P.arr.length, s=i*STEP;
  const sec=secAt(s), ls=s-sec.start;
  P.kTimer-=STEP;
  if(P.kTimer<=0){
    const maxK = sec.type==='city'?1/230 : sec.type==='tunnel'?1/420 : 1/2600;
    let t = R()<0.25?0:rr(0.35,1)*maxK*(R()<0.5?-1:1);
    if(P.h>0.55) t=-Math.abs(t)-maxK*0.3;
    if(P.h<-0.55) t=Math.abs(t)+maxK*0.3;
    P.kT=t; P.kTimer=rr(140,420);
  }
  let kT=P.kT;
  if(sec.type==='bay' && ls>sec.a1-250 && ls<sec.a2+250) kT=0;
  P.k+=clamp(kT-P.k,-0.00005*STEP,0.00005*STEP);
  let ty;
  if(sec.type==='city') ty=sec.baseY+3.5*Math.sin(ls/260+sec.phase);
  else if(sec.type==='tunnel') ty=1.0;
  else ty=42;
  const desired=clamp((ty-P.y)*0.02,-0.045,0.045);
  P.slope+=clamp(desired-P.slope,-0.0009*STEP,0.0009*STEP);
  const a={i,s,x:P.x,y:P.y,z:P.z,h:P.h,slope:P.slope,sec,ls,enc:isEnc(sec,ls),
    dx:Math.sin(P.h),dz:-Math.cos(P.h),rx:Math.cos(P.h),rz:Math.sin(P.h)};
  P.arr.push(a);
  P.h+=P.k*STEP;
  P.x+=Math.sin(P.h)*STEP; P.z+=-Math.cos(P.h)*STEP; P.y+=P.slope*STEP;
}
function S(i){ if(i<P.first) i=P.first; return P.arr[i-P.first]; }
function ensurePath(s){ while((P.first+P.arr.length-1)*STEP<s) genSample(); }
function trimPath(s){ const n=Math.floor(s/STEP)-P.first; if(n>0){P.arr.splice(0,n);P.first+=n;} }
function frameAt(s,o){
  const fi=s/STEP; let i=Math.floor(fi); let t=fi-i;
  if(i<P.first){i=P.first;t=0;}
  const a=S(i), b=S(i+1)||a;
  o.x=lerp(a.x,b.x,t); o.y=lerp(a.y,b.y,t); o.z=lerp(a.z,b.z,t);
  o.h=lerp(a.h,b.h,t); o.slope=lerp(a.slope,b.slope,t);
  o.dx=Math.sin(o.h); o.dz=-Math.cos(o.h); o.rx=Math.cos(o.h); o.rz=Math.sin(o.h);
  o.sec=a.sec; o.enc=a.enc; o.ls=s-a.sec.start;
  return o;
}

/* ============================================================
   baked lighting model (street lamps / tunnel lamps)
   ============================================================ */
const _L=[0,0,0];
function lightAt(s,u,y,out=_L){
  const sec=secAt(s), ls=s-sec.start, c=sec.col;
  out[0]=out[1]=out[2]=0.018;
  if(sec.type==='tunnel' && ls>=sec.encStart-1 && ls<=sec.encEnd+1 && u<1.3){
    const d1=(u+10.1)**2+(y-5.5)**2, d2=(u-0.1)**2+(y-5.5)**2;
    let b=2.4/(1+d1/9)+2.4/(1+d2/9)+0.3;
    b*=1+0.16*Math.cos(s*Math.PI*0.5);
    b*=1+1.6*sstep(140,0,ls-sec.encStart)+0.7*sstep(90,0,sec.encEnd-ls);
    out[0]+=c[0]*b; out[1]+=c[1]*b; out[2]+=c[2]*b;
    return out;
  }
  let e=0;
  for(const f of sec.fam){
    const k0=Math.ceil((s-60-f.off)/f.sp), k1=Math.floor((s+60-f.off)/f.sp);
    for(let k=k0;k<=k1;k++){
      const sl=k*f.sp+f.off;
      if(sec.type==='tunnel' && sl-sec.start>=sec.encStart-20 && sl-sec.start<sec.encEnd+20) continue;
      const ds=s-sl, du=u-f.u, dy=y-f.h;
      const d2=ds*ds+du*du+dy*dy+1;
      e+=Math.min(f.I*1.25, f.I*f.h*f.h*f.h/Math.pow(d2,1.5));
    }
  }
  out[0]+=c[0]*e; out[1]+=c[1]*e; out[2]+=c[2]*e;
  return out;
}

/* ============================================================
   renderer / scene / cameras

const canvas=document.getElementById('c');
const renderer=new THREE.WebGLRenderer({canvas,antialias:false,powerPreference:'high-performance',stencil:false});

/* ============================================================
   textures
   ============================================================ */
function canvasTex(w,h,draw,srgb=true){
  const c=document.createElement('canvas'); c.width=w; c.height=h;
  const x=c.getContext('2d'); draw(x,w,h);
  const t=new THREE.CanvasTexture(c); if(srgb) t.colorSpace=THREE.SRGBColorSpace;
  t.anisotropy=8; t.wrapS=t.wrapT=THREE.RepeatWrapping; return t;
}
function rrect(x,X,Y,w,h,r){x.beginPath();x.moveTo(X+r,Y);x.arcTo(X+w,Y,X+w,Y+h,r);x.arcTo(X+w,Y+h,X,Y+h,r);x.arcTo(X,Y+h,X,Y,r);x.arcTo(X,Y,X+w,Y,r);x.closePath();}
let TEX={};
function makeBaseTextures(){
  TEX.asphalt=canvasTex(256,256,(x,w,h)=>{
    const id=x.createImageData(w,h);
    for(let i=0;i<w*h;i++){let v=118+(Math.random()-0.5)*50; if(Math.random()<0.03) v+=50; id.data[i*4]=v;id.data[i*4+1]=v;id.data[i*4+2]=v*1.02;id.data[i*4+3]=255;}
    x.putImageData(id,0,0);
    x.globalAlpha=0.035; x.fillStyle='#000';
    for(let i=0;i<14;i++){x.fillRect(Math.random()*w,0,4+Math.random()*10,h);}
  });
  TEX.concrete=canvasTex(256,256,(x,w,h)=>{
    x.fillStyle='#8a8a86';x.fillRect(0,0,w,h);
    const id=x.getImageData(0,0,w,h);
    for(let i=0;i<w*h;i++){const n=(Math.random()-0.5)*26; for(let k=0;k<3;k++) id.data[i*4+k]+=n;}
    x.putImageData(id,0,0);
    x.globalAlpha=0.25;
    for(let i=0;i<12;i++){x.fillStyle=Math.random()<0.5?'#555':'#aaa';x.fillRect(0,Math.random()*h,w,1+Math.random()*3);}
    x.globalAlpha=0.5;x.fillStyle='#3a3a3a';x.fillRect(0,0,w,3);
  });
  TEX.tile=canvasTex(256,256,(x,w,h)=>{
    x.fillStyle='#d8d4c8';x.fillRect(0,0,w,h);
    x.strokeStyle='#8a877e';x.lineWidth=3;
    for(let i=0;i<=4;i++){x.beginPath();x.moveTo(0,i*64);x.lineTo(w,i*64);x.stroke();}
    for(let i=0;i<=2;i++){x.beginPath();x.moveTo(i*128,0);x.lineTo(i*128,h);x.stroke();}
    const id=x.getImageData(0,0,w,h);
    for(let i=0;i<w*h;i++){const n=(Math.random()-0.5)*14; for(let k=0;k<3;k++) id.data[i*4+k]+=n;}
    x.putImageData(id,0,0);
  });
  TEX.dash=canvasTex(4,64,(x,w,h)=>{x.clearRect(0,0,w,h);x.fillStyle='#fff';x.fillRect(0,0,w,Math.round(h*0.4));},false);
  TEX.dash.wrapS=TEX.dash.wrapT=THREE.RepeatWrapping;
}

function drawSign(x,w,h,sg){
  x.fillStyle='#0d6b40';x.fillRect(0,0,w,h);
  x.strokeStyle='#f2f2ee';x.lineWidth=9;rrect(x,16,16,w-32,h-32,20);x.stroke();
  x.textBaseline='middle';
  if(sg.badge){
    x.fillStyle='#fff';rrect(x,46,40,sg.badge.length>1?130:96,84,14);x.fill();
    x.fillStyle='#0d6b40';x.font=`900 60px ${FONT}`;x.textAlign='center';x.fillText(sg.badge,46+(sg.badge.length>1?65:48),84);
    x.fillStyle='#fff';x.textAlign='left';x.font=`700 62px ${FONT}`;x.fillText(sg.title,sg.badge.length>1?200:166,84);
  } else if(sg.exit){
    x.fillStyle='#fff';rrect(x,46,40,250,84,14);x.fill();
    x.fillStyle='#0d6b40';x.font=`900 54px ${FONT}`;x.textAlign='center';x.fillText('出口 EXIT',171,84);
  } else if(sg.title){
    x.fillStyle='#fff';x.textAlign='left';x.font=`700 62px ${FONT}`;x.fillText(sg.title,54,84);
  }
  sg.rows.forEach((r,i)=>{
    const y=196+i*108;
    x.fillStyle='#fff';x.textAlign='left';x.font=`700 78px ${FONT}`;x.fillText(r[0],70,y);
    const wj=x.measureText(r[0]).width;
    x.font=`400 38px ${FONT}`;x.fillText(r[1],90+wj,y+10);
  });
  if(sg.dist){x.font=`700 64px ${FONT}`;x.textAlign='right';x.fillStyle='#fff';x.fillText(sg.dist,w-56,h-62);}
  else {
    x.fillStyle='#fff';x.beginPath();const ax=w-110,ay=h-150;
    x.moveTo(ax,ay-70);x.lineTo(ax+46,ay-10);x.lineTo(ax+16,ay-10);x.lineTo(ax+16,ay+60);x.lineTo(ax-16,ay+60);x.lineTo(ax-16,ay-10);x.lineTo(ax-46,ay-10);x.closePath();x.fill();
  }
}
const SIGNS=[
  {badge:'C1',title:'都芯環状線',rows:[['銀坂','Ginzaka'],['霞ヶ原','Kasumigahara']]},
  {badge:'B',title:'湾港線',rows:[['羽根田空港','Haneta Airport'],['横濱浦','Yokohamaura']]},
  {badge:'11',title:'台浜線',rows:[['お台浜','Odaihama'],['有明洲','Ariakesu']]},
  {badge:'4',title:'新宿場線',rows:[['新宿場','Shinjukuba'],['中原道','Nakahara Expwy']]},
  {badge:'3',title:'渋原線',rows:[['渋原','Shibuhara'],['東湘道','Tosho Expwy']]},
  {badge:'6',title:'向洲線',rows:[['箱碕','Hakosaki'],['向洲','Mukosu']]},
  {badge:'C2',title:'外郭環状線',rows:[['池野袋','Ikenobukuro'],['葛浜','Kuzuhama']]},
  {exit:true,rows:[['芝之浦','Shibanoura']],dist:'500m'},
  {exit:true,rows:[['汐見留','Shiomidome']],dist:'1km'},
  {title:'浜碕橋 JCT',rows:[['オーロラブリッジ','Aurora Bridge']],dist:'1km'},
];
const LED_TEXTS=[['この先','渋滞なし'],['C1 外回り','順調'],['車間距離','確保'],['湾港線','流れています'],['事故多発','注意'],['所要時間','新宿場 12分'],['速度','落とせ']];
function ledTex(lines,color='#ffa630'){
  return canvasTex(768,192,(x,w,h)=>{
    x.fillStyle='#050505';x.fillRect(0,0,w,h);
    const lw=128,lh=32; const c=document.createElement('canvas');c.width=lw;c.height=lh;const cx=c.getContext('2d');
    cx.fillStyle='#000';cx.fillRect(0,0,lw,lh);cx.fillStyle='#fff';cx.textBaseline='middle';cx.textAlign='center';
    cx.font=`700 13px ${FONT}`;cx.fillText(lines[0],lw/2,8.5);cx.fillText(lines[1],lw/2,24);
    const d=cx.getImageData(0,0,lw,lh).data;const sx=w/lw,sy=h/lh;
    for(let j=0;j<lh;j++)for(let i=0;i<lw;i++){const v=d[(j*lw+i)*4];
      x.fillStyle=v>110?color:'#1a1208';x.beginPath();x.arc(i*sx+sx/2,j*sy+sy/2,sx*0.36,0,7);x.fill();}
  });
}
function makeSignTextures(){
  TEX.signs=SIGNS.map(sg=>canvasTex(1024,420,(x,w,h)=>drawSign(x,w,h,sg)));
  TEX.leds=LED_TEXTS.map(l=>ledTex(l));
  TEX.ledRain=ledTex(['雨天','速度注意']);

const BUILD_VS=`
varying vec3 vObj; varying vec3 vN; varying vec3 vSeed; varying vec3 vSize; varying vec3 vW;
void main(){
  vec3 sc=vec3(length(instanceMatrix[0].xyz),length(instanceMatrix[1].xyz),length(instanceMatrix[2].xyz));

  #ifdef USE_INSTANCING_COLOR

  #else
  vSeed=vec3(0.5);
  #endif

}`;
const BUILD_FS=`
uniform float uTime; uniform vec3 uHazeCol; uniform float uHaze; uniform float uAppear; uniform float uWinGain; uniform float uFar;
varying vec3 vObj; varying vec3 vN; varying vec3 vSeed; varying vec3 vSize; varying vec3 vW;
float hash13(vec3 p3){ p3=fract(p3*0.1031); p3+=dot(p3,p3.zyx+31.32); return fract((p3.x+p3.y)*p3.z); }
void main(){
  vec3 n=normalize(vN);
  float style=floor(vSeed.z*3.999);
  float seed=floor(vSeed.x*997.0);
  float litFrac=vSeed.y;
  vec3 col;
  float d=length(vW-cameraPosition);
  if(n.y>0.5){
    col=vec3(0.010,0.010,0.013);
    if(vSize.y>60.0){ vec2 q=abs(vObj.xz)/(vSize.xz*0.5); float e=max(q.x,q.y); col+=vec3(0.03,0.025,0.02)*step(0.9,e); }
  } else if(n.y<-0.5){ col=vec3(0.0); }
  else {
    float hc; float fwid; float face;
    if(abs(n.x)>0.5){ hc=vObj.z*sign(n.x); fwid=vSize.z; face=n.x>0.0?1.0:2.0; }
    else { hc=-vObj.x*sign(n.z); fwid=vSize.x; face=n.z>0.0?3.0:4.0; }
    hc+=fwid*0.5;
    vec2 cs = style<0.5? vec2(3.2,3.7) : style<1.5? vec2(3.6,2.9) : style<2.5? vec2(1.8,4.0) : vec2(2.6,3.3);
    vec2 g=vec2(hc,vObj.y-1.2)/cs;
    vec2 id=floor(g); vec2 f=fract(g);
    vec2 fw=fwidth(g);
    float pxs=max(fw.x,fw.y);
    vec2 lo = style<0.5? vec2(0.03,0.28) : style<1.5? vec2(0.18,0.22) : style<2.5? vec2(0.08,0.12) : vec2(0.15,0.25);
    vec2 hi = style<0.5? vec2(0.97,0.86) : style<1.5? vec2(0.82,0.78) : style<2.5? vec2(0.92,0.92) : vec2(0.85,0.80);
    vec2 aa=fw*0.8+0.001;
    float win=smoothstep(lo.x-aa.x,lo.x+aa.x,f.x)*smoothstep(hi.x+aa.x,hi.x-aa.x,f.x)*smoothstep(lo.y-aa.y,lo.y+aa.y,f.y)*smoothstep(hi.y+aa.y,hi.y-aa.y,f.y);
    float cov=(hi.x-lo.x)*(hi.y-lo.y);
    float r1=hash13(vec3(id.x,id.y,seed+face*7.13));
    float r2=hash13(vec3(floor(id.x/5.0),id.y,seed*0.37+face));
    float r3=hash13(vec3(id.y,id.x,seed+3.1));
    float lit; vec3 wc;
    if(style<0.5){ lit=step(r2,litFrac)*step(0.12,r1); wc=mix(vec3(0.72,0.84,1.0),vec3(1.0,0.9,0.75),step(0.6,r3)); }
    else if(style<1.5){ lit=step(r1,litFrac*0.8); wc= r3<0.72? vec3(1.0,0.64,0.34) : (r3<0.9? vec3(1.0,0.85,0.68) : vec3(0.45,0.6,1.0)); }
    else if(style<2.5){ lit=step(r1,litFrac*0.5); wc=vec3(0.8,0.88,1.0); }
    else { lit=step(r1,litFrac); wc= r3<0.55? vec3(1.0,0.74,0.45) : r3<0.8? vec3(0.75,0.88,1.0) : r3<0.9? vec3(1.0,0.6,0.62) : vec3(0.65,0.95,0.8); }

    if(vObj.y<1.2 || vObj.y>vSize.y-1.0) { lit=0.0; win*=0.0; }
    vec3 facade= (style>1.5&&style<2.5) ? vec3(0.007,0.010,0.015) : vec3(0.013,0.012,0.013);
    vec3 dark=vec3(0.006,0.008,0.012);
    vec3 wcol=mix(dark,wc*inten,lit)*(0.8+0.4*f.y);
    vec3 detail=mix(facade,wcol,win);
    vec3 avg=facade*(1.0-cov)+cov*(dark*(1.0-litFrac*0.6)+wc*(0.95*uWinGain)*litFrac*0.55);
    float farK=smoothstep(0.3*uFar,1.0*uFar,pxs);
    col=mix(detail,avg,farK);
    if(style>0.5&&style<1.5&&face<1.5){
      float cl=smoothstep(0.07+aa.x,0.07,abs(f.x-0.5))*smoothstep(0.09+aa.y,0.09,abs(f.y-0.88));
      col+=mix(vec3(1.0,0.95,0.85)*2.2*cl,vec3(1.0,0.95,0.85)*0.03,farK);
    }
    if(vSeed.y>0.8 && vSize.y>70.0){ float e=min(hc,fwid-hc); col+=vec3(0.7,0.85,1.0)*2.2*smoothstep(0.5,0.0,e)*(0.7+0.3*sin(uTime*0.4+seed)); }

  }
  float fog=1.0-exp(-pow(d*uHaze,2.0));
  col=mix(col,uHazeCol,fog);
  col=mix(uHazeCol*min(1.0,d/400.0),col,uAppear);
  gl_FragColor=vec4(col,1.0);
  #include <tonemapping_fragment>
  #include <colorspace_fragment>
}`;

function sweep(i0,i1,strips,opt={}){

function footprintClear(cx,cz,hw,hd,yawW,sC,margin){
  const c=Math.cos(yawW), sn=Math.sin(yawW); const reach=Math.hypot(hw,hd)+margin;
  for(let ss=Math.max(sC-1100,P.first*STEP); ss<=sC+1100; ss+=3){
    const a=S(Math.round(ss/STEP)); if(!a) break;
    const px=a.x-cx, pz=a.z-cz; if(px*px+pz*pz>reach*reach) continue;
    const lx=px*c-pz*sn, lz=px*sn+pz*c;
    const dx=Math.max(Math.abs(lx)-hw,0), dz=Math.max(Math.abs(lz)-hd,0);
    if(dx*dx+dz*dz<margin*margin) return false;
  }
  return true;
}
function chunkRng(ci,k=0){ return mulberry32((ci*2654435761+k*97+SEED*31)>>>0); }
const opPlan=new Map();
function overpassFor(ci){

}
function segDist(px,pz,ax,az,bx,bz){const vx=bx-ax,vz=bz-az;const t=clamp(((px-ax)*vx+(pz-az)*vz)/(vx*vx+vz*vz),0,1);return Math.hypot(px-ax-vx*t,pz-az-vz*t);}

    if(R()<0.22){ const a=S(i0+10); const sp=new THREE.Mesh(GEO.plane,MAT.speed); sp.matrix.copy(propM(a,-10.4,3.2,1.2,1.2,1,0).multiply(new THREE.Matrix4().makeRotationY(0))); sp.matrixAutoUpdate=false; g.add(sp);
      add(inst(unitBox,MAT.metal,[propM(a,-10.4,0,0.08,3.2,0.08).clone()])); }
    if(sec.type==='tunnel' && ls0===sec.encEnd){ // exit portal (seen in mirror / looking back)

  g.updateMatrixWorld(true);
  scene.add(g);

function buildOverpass(g,own,op){
  const a=op.a, th=op.th;
  const hx=-a.h+th;
  const cy=a.y+10.5;
  const cxv=Math.sin(-hx)*-1, czv=-Math.cos(-hx); // direction of crossing road (forward of rotated frame)
  const dir=new V3(Math.sin(a.h-th),0,-Math.cos(a.h-th));
  const L=700, W=13;
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,-(a.h-th),0));
  const center=new V3(a.x,cy,a.z);
  const mk=(off,sz,yo,mat)=>{const m=new THREE.Mesh(centerBox,mat);m.matrix.compose(new V3(center.x+off.x,cy+yo,center.z+off.z),q,sz);m.matrixAutoUpdate=false;g.add(m);};
  const side=new V3(dir.z,0,-dir.x);
  mk(new V3(),new V3(W,2.2,L),0,MAT.darkConcrete);
  mk(side.clone().multiplyScalar(W/2),new V3(0.3,1.2,L),1.7,MAT.concrete);
  mk(side.clone().multiplyScalar(-W/2),new V3(0.3,1.2,L),1.7,MAT.concrete);
  const heads=[],cols=[];
  for(let t=-L/2+10;t<L/2;t+=34){
    const p=center.clone().addScaledVector(dir,t);
    heads.push(new THREE.Matrix4().compose(new V3(p.x+side.x*4,cy+9,p.z+side.z*4),q,new V3(1,0.2,0.5)));
    if(Math.abs(t)>18 && Math.round(t)%2===0) cols.push(new THREE.Matrix4().compose(new V3(p.x,0,p.z),q,new V3(2.2,cy-1.1,2.2)));
  }
  const hm=new THREE.InstancedMesh(GEO.lampHead,MAT.lampHead.sodium,heads.length); heads.forEach((M,k)=>hm.setMatrixAt(k,M)); hm.matrixAutoUpdate=false; g.add(hm);
  const cm=new THREE.InstancedMesh(unitBox,MAT.darkConcrete,cols.length); cols.forEach((M,k)=>cm.setMatrixAt(k,M)); cm.matrixAutoUpdate=false; g.add(cm);
}

function cableY(sec,ls,deckY){
  if(ls<sec.a1||ls>sec.a2) return null;
  const top=78, low=3.2;
  if(ls<sec.t1){ const x=(ls-sec.a1)/(sec.t1-sec.a1); return deckY+1.5+(top-1.5)*Math.pow(x,1.7); }
  if(ls>sec.t2){ const x=(sec.a2-ls)/(sec.a2-sec.t2); return deckY+1.5+(top-1.5)*Math.pow(x,1.7); }
  const x=(ls-sec.mid)/((sec.t2-sec.t1)/2); return deckY+low+(top-low)*x*x;
}

    const pts=[];
    for(let j=0;j<=SPC;j+=2){
      const a=S(i0+j); const ls=a.s-sec.start; const cy=cableY(sec,ls,a.y); if(cy===null) continue;
      pts.push(new V3(a.x+a.rx*13.4*side,cy,a.z+a.rz*13.4*side));
      if(j%4===0) lights.push(propM(a,13.4*side,cy-a.y+0.9,0.55,0.55,0.55).clone());
      if(j%5===0 && cy-a.y>3) susp.push(propM(a,13.4*side,0.9,0.12,cy-a.y-0.9,0.12).clone());
    }
    if(pts.length>1){ const tg=tubeAlong(pts,0.45); own.push(tg); const m=new THREE.Mesh(tg,MAT.cable); m.matrixAutoUpdate=false; g.add(m); }
  }
  if(lights.length){ const lm=new THREE.InstancedMesh(GEO.sphere,MAT.cableLight,lights.length); lights.forEach((M,k)=>lm.setMatrixAt(k,M)); lm.matrixAutoUpdate=false; g.add(lm); }
  if(susp.length){ const sm=new THREE.InstancedMesh(unitBox,MAT.cable,susp.length); susp.forEach((M,k)=>sm.setMatrixAt(k,M)); sm.matrixAutoUpdate=false; g.add(sm); }
  // ships
  if(ls0>sec.a1 && ls0<sec.a2 && R()<0.5){
    const a=S(i0+25); const side=R()<0.5?-1:1; const u=side*rr(250,1100);
    const cx=a.x+a.rx*u, cz=a.z+a.rz*u;
    const pts=[],cols=[];
    const n=6+((R()*6)|0); const ang=R()*6.28;
    for(let k=0;k<n;k++){ const t=(k/(n-1)-0.5)*rr(40,90); pts.push(cx+Math.cos(ang)*t,rr(3,7),cz+Math.sin(ang)*t); cols.push(1.0,0.82,0.55); }
    pts.push(cx,14,cz); cols.push(1,1,1);
    pts.push(cx+Math.cos(ang)*30,9,cz+Math.sin(ang)*30); cols.push(1,0.1,0.05);
    g.add(makePoints(pts,cols,5));
  }
  // ferris wheel near the far shore
  if(ls0===Math.floor(sec.mid/100)*100){
    const a=S(i0+25); const u=-(980); const cx=a.x+a.rx*u, cz=a.z+a.rz*u;
    g.add(makeFerris(cx,cz,-a.h+0.4));
  }
  // cranes at approaches
  if(ls0===Math.max(100,Math.floor((sec.a1-350)/100)*100) ){
    for(let k=0;k<3;k++){ const a=S(i0+k*15); g.add(makeCrane(a,-rr(260,420),R()*6.28)); }
  }
}

function makeCrane(a,u,yaw){
  const grp=new THREE.Group();
  const x=a.x+a.rx*u, z=a.z+a.rz*u;
  const q=new THREE.Quaternion().setFromEuler(new THREE.Euler(0,yaw,0));
  const parts=[[[-8,0,-6],[1.2,40,1.2]],[[8,0,-6],[1.2,40,1.2]],[[-8,0,6],[1.2,40,1.2]],[[8,0,6],[1.2,40,1.2]],[[0,40,0],[18,3,14]],[[0,44,-20],[3,2.5,90]]];
  const im=new THREE.InstancedMesh(unitBox,MAT.tower,parts.length);
  parts.forEach(([o,sz],k)=>{const p=new V3(...o).applyQuaternion(q);im.setMatrixAt(k,new THREE.Matrix4().compose(new V3(x+p.x,p.y,z+p.z),q,new V3(...sz)));});
  grp.add(im);
  const rp=[];for(const o of [[0,46.6,-64],[0,46.6,24],[0,43.5,0]]){const p=new V3(...o).applyQuaternion(q);rp.push(x+p.x,p.y,z+p.z);}
  grp.add(makePoints(rp,[1,0.1,0.05,1,0.1,0.05,1,0.1,0.05],7,true));
  return grp;
}

/* points (lights at distance) */
const POINT_VS=`attribute vec3 color; attribute float size; uniform float uPR; uniform float uHaze; varying vec3 vC;
void main(){ vec4 mv=modelViewMatrix*vec4(position,1.0); gl_Position=projectionMatrix*mv; float d=-mv.z;
  float s=size*uPR*clamp(260.0/max(d,1.0),0.6,3.0); gl_PointSize=max(s,1.5*uPR);
  vC=color*exp(-pow(d*uHaze*0.7,2.0))*min(1.0,s*s/(gl_PointSize*gl_PointSize)+0.35); }`;
const POINT_FS=`uniform float uBlink; uniform float uUseBlink; varying vec3 vC; void main(){ vec2 p=gl_PointCoord-0.5; float r=dot(p,p)*4.0; float a=exp(-r*3.5);
  float b=mix(1.0,uBlink,uUseBlink); gl_FragColor=vec4(vC*a*b*3.0,1.0); }`;
function pointsMat(blink=false){
  return new THREE.ShaderMaterial({uniforms:{uPR:U.pr,uHaze:U.haze,uBlink:U.blink,uUseBlink:{value:blink?1:0}},vertexShader:POINT_VS,fragmentShader:POINT_FS,
    transparent:true,depthWrite:false,blending:THREE.AdditiveBlending});
}
const PMAT={};
function makePoints(pos,col,size,blink=false){
  const gm=new THREE.BufferGeometry(); gm.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); gm.setAttribute('color',new THREE.Float32BufferAttribute(col,3));
  gm.setAttribute('size',new THREE.Float32BufferAttribute(new Array(pos.length/3).fill(size),1));
  const key=blink?'b':'s'; PMAT[key]=PMAT[key]||pointsMat(blink);
  const p=new THREE.Points(gm,PMAT[key]); p.frustumCulled=false; return p;
}
function makeFerris(cx,cz,yaw){
  const grp=new THREE.Group(); grp.position.set(cx,0,cz); grp.rotation.y=yaw;
  const Rw=52, Hc=64;
  const wheel=new THREE.Group(); wheel.position.y=Hc; grp.add(wheel);
  const pos=[],ang=[];
  const seg=128;
  for(const zz of [-2.5,2.5]) for(let i=0;i<seg;i++){const a0=i/seg*Math.PI*2,a1=(i+1)/seg*Math.PI*2;pos.push(Math.cos(a0)*Rw,Math.sin(a0)*Rw,zz,Math.cos(a1)*Rw,Math.sin(a1)*Rw,zz);ang.push(a0,a1);}
  for(let i=0;i<32;i++){const a=i/32*Math.PI*2;pos.push(0,0,0,Math.cos(a)*Rw,Math.sin(a)*Rw,0);ang.push(a,a);}
  const gm=new THREE.BufferGeometry(); gm.setAttribute('position',new THREE.Float32BufferAttribute(pos,3)); gm.setAttribute('ang',new THREE.Float32BufferAttribute(ang,1));
  const mat=new THREE.ShaderMaterial({uniforms:{uTime:U.time},vertexShader:`attribute float ang; varying float vA; varying float vR; void main(){vA=ang; vR=length(position.xy); gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0);}`,
    fragmentShader:`uniform float uTime; varying float vA; varying float vR;
      vec3 hsv(float h){ vec3 k=clamp(abs(fract(h+vec3(0.,2.,1.)/3.)*6.-3.)-1.,0.,1.); return k; }
      void main(){ float m=mod(floor(uTime/12.0),3.0); vec3 c;
        if(m<0.5) c=hsv(vA/6.2831+uTime*0.05);
        else if(m<1.5) c=mix(vec3(1.0,0.85,0.6),vec3(0.4,0.6,1.0),step(0.5,fract(vA*2.546+uTime*0.3)));
        else c=hsv(vR/60.0-uTime*0.1);
        gl_FragColor=vec4(c*2.6,1.0); }`});
  wheel.add(new THREE.LineSegments(gm,mat));
  const legs=new THREE.InstancedMesh(unitBox,MAT.tower,2);
  legs.setMatrixAt(0,new THREE.Matrix4().compose(new V3(-12,0,0),new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,-0.18)),new V3(1.5,Hc+2,1.5)));
  legs.setMatrixAt(1,new THREE.Matrix4().compose(new V3(12,0,0),new THREE.Quaternion().setFromEuler(new THREE.Euler(0,0,0.18)),new V3(1.5,Hc+2,1.5)));
  grp.add(legs);
  grp.userData.tick=(t)=>{wheel.rotation.z=t*0.02;};
  animated.push(grp);
  return grp;
}

function disposeChunk(c){
  scene.remove(c.g);
  for(const o of c.own) if(o&&o.dispose) o.dispose();
  c.g.traverse(o=>{ if(o.isInstancedMesh) o.dispose(); if(o.isPoints||o.isLineSegments) o.geometry.dispose(); const i=animated.indexOf(o); if(i>=0) animated.splice(i,1); });
  for(const m of c.appearMats) m.dispose();
}

/* ============================================================
   sky, ground/water, skyline ring, planes
   ============================================================ */
let sky, ground, skyline, skylineLights, planes;
const WATER_N=48;
function makeWorld(){
  sky=new THREE.Mesh(new THREE.SphereGeometry(8500,48,24),new THREE.ShaderMaterial({
    uniforms:{uTime:U.time,uRain:U.rain},side:THREE.BackSide,depthWrite:false,fog:false,
    vertexShader:`varying vec3 vDir; void main(){ vDir=position; vec4 p=projectionMatrix*modelViewMatrix*vec4(position,1.0); gl_Position=p.xyww; }`,
    fragmentShader:`uniform float uTime; uniform float uRain; varying vec3 vDir;
      float h21(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
      float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h21(i),h21(i+vec2(1,0)),f.x),mix(h21(i+vec2(0,1)),h21(i+vec2(1,1)),f.x),f.y); }
      float fbm(vec2 p){ float s=0.,a=0.5; for(int i=0;i<5;i++){ s+=a*vn(p); p*=2.03; a*=0.5; } return s; }
      void main(){ vec3 d=normalize(vDir); float e=d.y;
        vec3 zen=vec3(0.0025,0.0035,0.010), hor=vec3(0.085,0.058,0.062);
        float t=pow(clamp(e,0.0,1.0),0.42);
        vec3 c=mix(hor,zen,t);
        if(e>0.0){
          vec2 uv=d.xz/(e+0.12)*1.3+vec2(uTime*0.004,uTime*0.002);
          float n=fbm(uv);
          float cl=smoothstep(0.42-uRain*0.32,0.88,n);
          vec3 cc=mix(vec3(0.075,0.05,0.045),vec3(0.03,0.025,0.03),t)*(1.0+uRain*0.5);
          c=mix(c,cc,cl*0.85);
          vec2 sg=floor(d.xz/(e+0.3)*260.0);
          float st=step(0.9975,h21(sg))*smoothstep(0.15,0.6,e)*(1.0-cl)*(1.0-uRain);
          c+=vec3(0.5,0.55,0.7)*st*0.25;
        }
        c=mix(c,mix(hor*1.25,vec3(0.05,0.045,0.05),t),uRain*0.55);
        gl_FragColor=vec4(c,1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  }));
  sky.renderOrder=-10; sky.frustumCulled=false; scene.add(sky);

  const wpts=[]; for(let i=0;i<WATER_N;i++) wpts.push(new V3(0,0,-1));
  ground=new THREE.Mesh(new THREE.PlaneGeometry(16000,16000,1,1).rotateX(-Math.PI/2),new THREE.ShaderMaterial({
    uniforms:{uTime:U.time,uWater:{value:wpts},uWaterN:{value:0},uRefl:U.reflTex,uTexMat:U.texMat,uReflWater:U.reflWater,uHazeCol:U.hazeCol,uHaze:U.haze,uWet:U.wet,uRain:U.rain},
    vertexShader:`uniform mat4 uTexMat; varying vec3 vW; varying vec4 vR; void main(){ vec4 wp=modelMatrix*vec4(position,1.0); vW=wp.xyz; vR=uTexMat*wp; gl_Position=projectionMatrix*viewMatrix*wp; }`,
    fragmentShader:`uniform float uTime; uniform vec3 uWater[${WATER_N}]; uniform int uWaterN; uniform sampler2D uRefl; uniform float uReflWater; uniform vec3 uHazeCol; uniform float uHaze; uniform float uWet; uniform float uRain;
      varying vec3 vW; varying vec4 vR;
      float h12(vec2 p){ vec3 p3=fract(vec3(p.xyx)*.1031); p3+=dot(p3,p3.yzx+33.33); return fract((p3.x+p3.y)*p3.z); }
      float vn(vec2 p){ vec2 i=floor(p),f=fract(p); f=f*f*(3.-2.*f); return mix(mix(h12(i),h12(i+vec2(1,0)),f.x),mix(h12(i+vec2(0,1)),h12(i+vec2(1,1)),f.x),f.y); }
      float glow(vec2 d, float r, float px){ float rr=max(r,px*0.9); return exp(-dot(d,d)/(rr*rr))*(r*r)/(rr*rr); }
      void main(){
        vec2 p=vW.xz; float dist=length(vW-cameraPosition);
        float wm=0.0;
        for(int i=0;i<${WATER_N};i++){ if(i>=uWaterN) break; vec3 w=uWater[i]; float l=length(p-w.xy); wm=max(wm,1.0-smoothstep(w.z-160.0,w.z,l)); }
        float px=max(fwidth(p.x),fwidth(p.y));
        // ---- land
        vec2 q=mat2(0.94,-0.34,0.34,0.94)*p;
        vec2 bs=vec2(110.0,86.0);
        vec2 cf=mod(q,bs);
        float dz=min(cf.y,bs.y-cf.y), dx=min(cf.x,bs.x-cf.x);
        float street=1.0-smoothstep(4.5,5.5+px,min(dx,dz));
        vec3 land=vec3(0.009,0.008,0.009)+street*vec3(0.03,0.022,0.015);
        vec3 lampC=vec3(1.0,0.55,0.22);
        // lamps along streets
        vec2 la=vec2(mod(q.x,30.0)-15.0, min(abs(cf.y-5.5),abs(cf.y-bs.y+5.5)));
        vec2 lb=vec2(min(abs(cf.x-5.5),abs(cf.x-bs.x+5.5)), mod(q.y,30.0)-15.0);
        vec3 L=lampC*(glow(la,0.9,px)+glow(lb,0.9,px))*2.0;
        // lamp pools
        L+=lampC*0.05*(exp(-dot(la,la)/60.0)+exp(-dot(lb,lb)/60.0));
        // moving cars along streets
        float sidA=floor((q.y+bs.y*0.5)/bs.y), sidB=floor((q.x+bs.x*0.5)/bs.x);
        float yy=mod(q.y+bs.y*0.5,bs.y)-bs.y*0.5, xx=mod(q.x+bs.x*0.5,bs.x)-bs.x*0.5;
        float spA=7.0+6.0*h12(vec2(sidA,3.1)), spB=7.0+6.0*h12(vec2(sidB,7.7));
        float c1=mod(q.x+uTime*spA+h12(vec2(sidA,1.0))*90.0,63.0)-31.5;
        float c2=mod(q.x-uTime*spA*0.9+h12(vec2(sidA,2.0))*90.0,51.0)-25.5;
        float c3=mod(q.y+uTime*spB+h12(vec2(sidB,1.0))*90.0,57.0)-28.5;
        float c4=mod(q.y-uTime*spB*0.9+h12(vec2(sidB,2.0))*90.0,71.0)-35.5;
        L+=vec3(1.0,0.12,0.05)*glow(vec2(c1,yy+1.8),0.6,px)*2.2+vec3(1.0,0.95,0.85)*glow(vec2(c2,yy-1.8),0.6,px)*2.6;
        L+=vec3(1.0,0.12,0.05)*glow(vec2(xx+1.8,c3),0.6,px)*2.2+vec3(1.0,0.95,0.85)*glow(vec2(xx-1.8,c4),0.6,px)*2.6;
        // houses' windows
        vec2 hc=floor(q/7.0); vec2 hf=fract(q/7.0)-0.5;
        float hr=h12(hc*1.37);
        float inBlock=1.0-street;
        L+=mix(vec3(1.0,0.7,0.4),vec3(0.7,0.85,1.0),step(0.7,h12(hc+9.1)))*step(hr,0.16)*glow(hf*7.0,0.8,px)*0.6*inBlock;
        land+=L;
        land*=mix(1.0,0.75,uWet);
        // ---- water
        vec3 water=vec3(0.003,0.005,0.009);
        vec3 V=normalize(cameraPosition-vW);
        float F=0.03+0.97*pow(1.0-clamp(V.y,0.0,1.0),5.0);
        float n1=vn(p*0.06+vec2(uTime*0.11,uTime*0.07)), n2=vn(p*0.06*1.7-vec2(uTime*0.09,-uTime*0.12));
        vec2 off=(vec2(n1,n2)-0.5)*0.05*clamp(140.0/dist,0.08,1.0);
        if(uReflWater>0.5){
          vec2 ruv=vR.xy/vR.w+off*vec2(0.3,1.0);
          vec3 rc=vec3(0.0);
          for(int k=0;k<6;k++) rc+=texture2D(uRefl,ruv+vec2(0.0,float(k)*0.007)).rgb;
          water+=rc/6.0*(0.25+F*1.1);
        } else water+=uHazeCol*F*0.9;
        water+=vec3(0.02,0.025,0.03)*pow(max(n1*n2,0.0),3.0)*F;
        // shore lights
        float shore=smoothstep(0.0,0.3,wm)*smoothstep(0.75,0.35,wm);
        vec3 col=mix(land,water,smoothstep(0.35,0.55,wm));
        col+=vec3(1.0,0.6,0.25)*shore*0.25;
        float fog=1.0-exp(-pow(dist*uHaze,2.0));
        col=mix(col,uHazeCol,fog);
        gl_FragColor=vec4(col,1.0);
        #include <tonemapping_fragment>
        #include <colorspace_fragment>
      }`
  }));
  ground.frustumCulled=false; scene.add(ground);

  // skyline ring
  const N=1700, mats=[], cols=[];
  const clusters=[]; for(let i=0;i<7;i++) clusters.push(R()*Math.PI*2);
  for(let i=0;i<N;i++){
    const ang=R()*Math.PI*2; const r=rr(1950,4600);
    let near=0; for(const c of clusters){ let da=Math.abs(((ang-c+Math.PI*3)%(Math.PI*2))-Math.PI); near=Math.max(near,1-da/0.22); }
    const h=near>0? rr(40,110)+near*rr(60,200) : 15*Math.pow(10,R()*0.9);
    const w=rr(25,70), d=rr(25,70);
    mats.push(new THREE.Matrix4().compose(new V3(Math.cos(ang)*r,0,Math.sin(ang)*r),new THREE.Quaternion().setFromEuler(new THREE.Euler(0,R()*3,0)),new V3(w,h,d)));
    cols.push([R(),rr(0.35,0.9),((h>100?(R()<0.6?2:0):pick([0,1,1,3]))+0.5)/4]);
  }
  skyline=inst(unitBox,buildingMat(0.00016,1.4,3.5),mats,cols); skyline.frustumCulled=false; scene.add(skyline);
  // skyline red aviation lights + generic broadcast towers
  const rp=[],rc=[];
  mats.forEach(m=>{const p=new V3(),q=new THREE.Quaternion(),s=new V3();m.decompose(p,q,s); if(s.y>90){rp.push(p.x,s.y+2,p.z);rc.push(1,0.08,0.04);}});
  for(let k=0;k<2;k++){
    const ang=clusters[k]+0.1, r=3000+k*600; const x=Math.cos(ang)*r, z=Math.sin(ang)*r;
    const hgt=k===0?330:600;
    for(let j=0;j<60;j++){ const t=j/59; const yy=t*hgt; const w=(1-t)*(k===0?40:18)+2;
      for(const [ox,oz] of [[-1,-1],[1,-1],[1,1],[-1,1]]){ rp.push(x+ox*w*0.5,yy,z+oz*w*0.5); if(k===0) rc.push(1.0,0.42,0.12); else rc.push(0.55,0.75,1.0); } }
    rp.push(x,hgt+4,z); rc.push(1,0.1,0.05);
  }
  skylineLights=makePoints(rp,rc,4,false);
  skylineLights.material=pointsMat(false);
  scene.add(skylineLights);
  // planes
  planes=[];
  const pg=new THREE.BufferGeometry(); pg.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(4*4*3),3));
  pg.setAttribute('color',new THREE.Float32BufferAttribute(new Float32Array(4*4*3),3)); pg.setAttribute('size',new THREE.Float32BufferAttribute(new Float32Array(16).fill(3.2),1));
  const pp=new THREE.Points(pg,pointsMat(false)); pp.frustumCulled=false; scene.add(pp);
  for(let i=0;i<4;i++) planes.push({x:0,y:0,z:0,vx:0,vz:0,ph:R()*10,alive:false});
  planes.mesh=pp;
}

  for(const d of drops){ d.life+=dt*age; if(d.r>3.2) d.y-=vUp*dt*(d.r/6); }
  drops=drops.filter(d=>d.life<d.max && d.y>-12);
  if(drops.length>900) drops.splice(0,drops.length-900);
  // wipers
  const wiping= state.rain>0.08 || state.wiperPhase>0;
  if(wiping){
    if(state.wiperPause>0){ state.wiperPause-=dt; }
    else {
      const prev=state.wiperPhase; state.wiperPhase+=dt/1.15;
      if(prev<0.5 && state.wiperPhase>=0.5) sound.wiper();
      if(state.wiperPhase>=1){ state.wiperPhase=0; state.wiperPause= state.rain>0.65?0: state.rain>0.3?0.9: 3.2; if(state.rain<0.08) state.wiperPhase=0; }
    }
  }
  const ang=wiperAngle(state.wiperPhase);
  for(let k=0;k<2;k++){
    const pa=state.wiperAng[k], na=ang; state.wiperAng[k]=na;
    if(Math.abs(pa-na)>1e-5){
      const lo=Math.min(pa,na)-0.03, hi=Math.max(pa,na)+0.03;
      drops=drops.filter(d=>{ const dx=d.x-PIV[k][0], dy=PIV[k][1]-d.y; const r=Math.hypot(dx,dy), a=Math.atan2(dy,dx); return !(r>BL[k][0]&&r<BL[k][1]&&a>=lo&&a<=hi); });
    }
  }
  // draw
  const x=dropsCtx; x.clearRect(0,0,640,360);
  for(const d of drops){ const gr=x.createRadialGradient(d.x-d.r*0.25,d.y-d.r*0.3,0,d.x,d.y,d.r); gr.addColorStop(0,'rgba(255,255,255,1)'); gr.addColorStop(0.6,'rgba(255,255,255,0.65)'); gr.addColorStop(1,'rgba(255,255,255,0)');
    x.globalAlpha=1-sstep(d.max-1.4,d.max,d.life); x.fillStyle=gr; x.beginPath(); x.ellipse(d.x,d.y,d.r*(0.7+0.3*x.globalAlpha),d.r*0.9*(0.7+0.3*x.globalAlpha),0,0,7); x.fill(); }
  x.globalAlpha=1;
  dropsTex.needsUpdate=true;
  const asp=innerWidth/innerHeight;
  const toUV=(px,py)=>[px/640*asp,1-py/360];
  const seg=(k)=>{ const [cx,cy]=PIV[k]; const a=state.wiperAng[k]; const r0=BL[k][0]*0.4, r1=BL[k][1];
    const p0=toUV(cx+Math.cos(a)*r0, cy-Math.sin(a)*r0), p1=toUV(cx+Math.cos(a)*r1, cy-Math.sin(a)*r1); return new THREE.Vector4(p0[0],p0[1],p1[0],p1[1]); };
  dropsPass.uniforms.uW1.value.copy(seg(0)); dropsPass.uniforms.uW2.value.copy(seg(1));
  dropsPass.uniforms.uAspect.value=asp;
  dropsPass.uniforms.uWipe.value= (state.view==='interior' && !dbg.on && (state.wiperPhase>0.001 && state.wiperPhase<0.999))?1:0;
  dropsPass.uniforms.uAmt.value= !dbg.on&&(drops.length>0||state.rain>0.01) ? 1:0;
  dropsPass.uniforms.uFilm.value= state.rain*0.25*(state.tunnel<0.5?1:0);
}

/* ============================================================
   main update
   ============================================================ */
let running=false, frameN=0;
function waterPoints(){
  const arr=ground.material.uniforms.uWater.value; let n=0;
  const cand=[];
  for(const sec of sections){ if(sec.type!=='bay') continue; if(sec.end<ego.s-4000||sec.start>ego.s+4000) continue;
    for(let ls=sec.a1-150; ls<=sec.a2+150; ls+=110){ const s=sec.start+ls; const a=S(Math.round(s/STEP)); if(!a) continue; cand.push([a.x,a.z,Math.abs(s-ego.s)]); } }
  cand.sort((p,q)=>p[2]-q[2]);
  for(const c of cand){ if(n>=WATER_N) break; arr[n].set(c[0],c[1],1700); n++; }
  ground.material.uniforms.uWaterN.value=n;
  return cand.length && cand[0][2]<3200;
}
let waterNear=false, lastWaterS=-1e9;
const sameDirPrev=new Map();
function update(dt){
  U.time.value+=dt;
  const t=U.time.value;
  ensurePath(ego.s+AHEAD+1100);
  // chunks
  const cA=Math.floor((ego.s-BEHIND)/CH), cB=Math.floor((ego.s+AHEAD)/CH);
  let built=0;
  for(let ci=Math.max(0,cA);ci<=cB;ci++){ if(!chunks.has(ci) && built<1){ chunks.set(ci,buildChunk(ci)); built++; } }
  for(const [ci,c] of chunks){ if(ci<cA||ci>cB+1){ disposeChunk(c); chunks.delete(ci); } else for(const m of c.appearMats){ m.uniforms.uAppear.value=Math.min(1,(t-c.born)/2.5); } }
  trimPath(ego.s-1200);
  // traffic & ego
  const prevS=ego.s;
  updateTraffic(dt);
  const f=frameAt(ego.s,_f);
  // joints
  const jsp=f.sec.type==='bay'?100:40;
  if(!f.enc && f.y>4 && Math.floor(ego.s/jsp)!==Math.floor(prevS/jsp)){ sound.joint(ego.v); state.bumpV+=0.05; setTimeout(()=>{state.bumpV+=0.035;},2700/Math.max(ego.v,3)); }
  state.bumpV+= (-state.bump*160 - state.bumpV*14)*dt; state.bump+=state.bumpV*dt;
  // passing sounds
  for(const c of cars){
    const rel=c.s-ego.s;
    const prev=sameDirPrev.get(c);
    if(prev!==undefined && Math.sign(prev)!==Math.sign(rel) && Math.abs(rel)<30){
      const big=c.type.k==='truck'||c.type.k==='bus';
      if(c.dir<0){ if(state.tunnel<0.5) sound.whoosh(0.75,(big?0.22:0.1),big?1.3:0.9); }
      else if(c.lane!==ego.lane) sound.whoosh(c.lane>ego.lane?0.5:-0.5,big?0.18:0.08,1.6);
    }
    sameDirPrev.set(c,rel);
  }
  if(sameDirPrev.size>200){ for(const k of sameDirPrev.keys()) if(!cars.includes(k)) sameDirPrev.delete(k); }
  // blinker
  if(ego.blink){ const ph=Math.floor(t*2.8); if(ph!==state.blinkPh){ state.blinkPh=ph; sound.tick(ph%2===0); } blinkLamp.material.color.setRGB(0, (Math.floor(t*2.8)%2===0)?1.6:0, 0.3*((Math.floor(t*2.8)%2===0)?1:0)); }
  else blinkLamp.material.color.setRGB(0,0,0);
  // tunnel state
  state.tunnel+= ((f.enc?1:0)-state.tunnel)*(1-Math.exp(-dt*2.5));
  updateWeather(dt);
  updateCamera(dt,f);
  if(dbg.on) updateDebug(dt,f);
  // world-following objects
  sky.position.copy(camera.position);
  ground.position.set(camera.position.x,0,camera.position.z);
  skyline.position.set(camera.position.x,0,camera.position.z);
  skylineLights.position.copy(skyline.position);
  U.blink.value= (t%1.5)<0.75 ? 1:0.08;
  MAT.redBlink.color.setRGB(6*U.blink.value,0.2*U.blink.value,0.1*U.blink.value);
  for(const a of animated) a.userData.tick&&a.userData.tick(t);
  // planes
  const pa=planes.mesh.geometry.attributes; let k=0;
  for(const pl of planes){
    if(!pl.alive || Math.hypot(pl.x-camera.position.x,pl.z-camera.position.z)>6500) respawnPlane(pl,camera.position.x,camera.position.z);
    pl.x+=pl.vx*dt; pl.z+=pl.vz*dt; pl.y=Math.max(150,pl.y+pl.vy*dt);
    const hx=pl.vx/80, hz=pl.vz/80; const sx=-hz*16, sz=hx*16;
    const strobe=((t+pl.ph)%1.3)<0.06||(((t+pl.ph)%1.3)>0.16&&((t+pl.ph)%1.3)<0.2);
    const beacon=((t+pl.ph*0.7)%1.0)<0.12;
    const L=[[pl.x+sx,pl.y,pl.z+sz,1,0.1,0.05],[pl.x-sx,pl.y,pl.z-sz,0.1,1,0.3],[pl.x,pl.y+2,pl.z,beacon?1.6:0,beacon?0.1:0,0],[pl.x,pl.y,pl.z,strobe?3:0.25,strobe?3:0.22,strobe?3:0.2]];
    for(const q of L){ pa.position.array.set(q.slice(0,3),k*3); pa.color.array.set(q.slice(3),k*3); k++; }
  }
  pa.position.needsUpdate=true; pa.color.needsUpdate=true;
  // rain
  const vel=_v2.set(f.dx*ego.v,0,f.dz*ego.v);
  rainDisp.x+=-vel.x*dt+Math.sin(t*0.3)*0.6*dt; rainDisp.y+=-11*dt; rainDisp.z+=-vel.z*dt;
  rainLines.material.uniforms.uVel.value.set(-vel.x,-11,-vel.z);
  rainLines.material.uniforms.uAmt.value=state.rain*(1-state.tunnel);
  const L0=lightAt(ego.s,ego.u,4); rainLines.material.uniforms.uLight.value.setRGB(0.05+L0[0]*0.12,0.05+L0[1]*0.12,0.06+L0[2]*0.12);
  rainLines.visible=state.rain>0.01;
  // interior lighting
  const Li=lightAt(ego.s+1.0,ego.u+0.4,1.6);
  iAmb.color.setRGB(0.25+Li[0]*0.9,0.25+Li[1]*0.9,0.28+Li[2]*0.9); iAmb.intensity=0.7;
  updateDrops(dt);
  renderTraffic();
  sound.update({v:ego.v,acc:ego.acc,tunnel:state.tunnel,wet:state.wet,rain:state.rain*(1-state.tunnel)});
  // water / reflection points
  if(Math.abs(ego.s-lastWaterS)>60){ waterNear=waterPoints(); lastWaterS=ego.s; }
}
function render(){
  frameN++;
  const useRefl = quality==='high';
  if(useRefl && waterNear && camera.position.y>8){ U.reflWater.value=1; U.reflRoad.value=0; renderReflection(0.0); }
  else if(useRefl && state.wet>0.04 && !waterNear && !dbg.on){ U.reflWater.value=0; U.reflRoad.value=1; const f=frameAt(ego.s,_f2); renderReflection(f.y+0.02); }
  else { U.reflWater.value=0; U.reflRoad.value=0; }
  if(state.view==='interior' && !dbg.on && quality==='high' && frameN%2===0){
    const saved=U.reflRoad.value; U.reflRoad.value=0; rainLines.visible=false;
    renderer.setRenderTarget(mirrorRT); renderer.clear(); renderer.render(scene,rearCam); renderer.setRenderTarget(null);
    U.reflRoad.value=saved; rainLines.visible=state.rain>0.01;
  }
  gradePass.uniforms.uTime.value=U.time.value;
  composer.render();
}

/* ============================================================
   bird's-eye debug view
   ============================================================ */
const dbg={on:false,yaw:0.5,pitch:1.05,dist:950,t:0,fps:60,drag:null};
const SEC_COL={city:[1.0,0.72,0.3],tunnel:[1.0,0.3,0.75],bay:[0.3,0.75,1.0]};
const SEC_JP={city:'都市高架',tunnel:'トンネル',bay:'湾岸・橋'};
function makeDebug(){
  dbg.group=new THREE.Group(); dbg.group.visible=false; scene.add(dbg.group);
  const NP=2400;
  const lg=new THREE.BufferGeometry(); lg.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(NP*3),3)); lg.setAttribute('color',new THREE.Float32BufferAttribute(new Float32Array(NP*3),3));
  dbg.path=new THREE.Line(lg,new THREE.LineBasicMaterial({vertexColors:true,depthTest:false,transparent:true,fog:false,toneMapped:false}));
  dbg.path.frustumCulled=false; dbg.path.renderOrder=50; dbg.group.add(dbg.path);
  dbg.beads=new THREE.Points(lg,new THREE.PointsMaterial({size:5,sizeAttenuation:false,vertexColors:true,depthTest:false,transparent:true,fog:false,toneMapped:false}));
  dbg.beads.frustumCulled=false; dbg.beads.renderOrder=50; dbg.group.add(dbg.beads);
  const NT=120;
  const tg=new THREE.BufferGeometry(); tg.setAttribute('position',new THREE.Float32BufferAttribute(new Float32Array(NT*2*3),3)); tg.setAttribute('color',new THREE.Float32BufferAttribute(new Float32Array(NT*2*3),3));
  dbg.ticks=new THREE.LineSegments(tg,new THREE.LineBasicMaterial({vertexColors:true,depthTest:false,transparent:true,fog:false,toneMapped:false}));
  dbg.ticks.frustumCulled=false; dbg.ticks.renderOrder=51; dbg.group.add(dbg.ticks);
  dbg.ego=new THREE.Mesh(new THREE.BoxGeometry(2.4,1.8,5.2).translate(0,0.9,0),new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(0.2,3,3),fog:false,toneMapped:false}));
  dbg.group.add(dbg.ego);
  dbg.beacon=new THREE.Mesh(new THREE.CylinderGeometry(0.6,0.6,60,8).translate(0,30,0),new THREE.MeshBasicMaterial({color:new THREE.Color().setRGB(0.1,1.5,1.5),fog:false,toneMapped:false,transparent:true,opacity:0.6,depthTest:false}));
  dbg.group.add(dbg.beacon);
  dbg.el=document.getElementById('dbgInfo');
  canvas.addEventListener('pointerdown',e=>{ if(!dbg.on) return; dbg.drag={x:e.clientX,y:e.clientY}; document.body.classList.add('dragging'); canvas.setPointerCapture(e.pointerId); });
  canvas.addEventListener('pointermove',e=>{ if(!dbg.on||!dbg.drag) return; dbg.yaw-= (e.clientX-dbg.drag.x)*0.006; dbg.pitch=clamp(dbg.pitch+(e.clientY-dbg.drag.y)*0.005,0.08,1.52); dbg.drag={x:e.clientX,y:e.clientY}; });
  canvas.addEventListener('pointerup',()=>{ dbg.drag=null; document.body.classList.remove('dragging'); });
  canvas.addEventListener('wheel',e=>{ if(!dbg.on) return; e.preventDefault(); dbg.dist=clamp(dbg.dist*Math.exp(e.deltaY*0.0012),25,4200); },{passive:false});
}
function setDebug(on){
  dbg.on=on; dbg.group.visible=on; document.body.classList.toggle('debug',on);
  dbg.el.style.display=on?'block':'none';
  document.getElementById('bDebug').textContent=on?'運転席へ':'俯瞰';
  interiorPass.enabled= !on && state.view==='interior';
  headlight.intensity=on?0:140;
  if(on) drops=[];
}
function updateDebug(dt,f){
  dbg.fps=lerp(dbg.fps,1/Math.max(dt,1e-3),0.05);
  dbg.ego.position.set(f.x+f.rx*ego.u,f.y,f.z+f.rz*ego.u); dbg.ego.rotation.set(0,-f.h,0);
  dbg.beacon.position.copy(dbg.ego.position); dbg.beacon.scale.y=Math.max(1,dbg.dist/400);
  dbg.t-=dt; if(dbg.t>0) return; dbg.t=0.25;
  // path line (everything generated, every 2 samples)
  const pa=dbg.path.geometry.attributes; let n=0; const NP=pa.count;
  const stepI=Math.max(1,Math.ceil(P.arr.length/NP));
  for(let i=0;i<P.arr.length && n<NP;i+=stepI){ const a=P.arr[i]; const c=SEC_COL[a.sec.type]; const gen=chunks.has(Math.floor(a.i/SPC));
    const k=gen?1.6:0.45; pa.position.setXYZ(n,a.x,a.y+4,a.z); pa.color.setXYZ(n,c[0]*k,c[1]*k,c[2]*k); n++; }
  dbg.path.geometry.setDrawRange(0,n); pa.position.needsUpdate=true; pa.color.needsUpdate=true;
  // chunk boundary ticks
  const ta=dbg.ticks.geometry.attributes; let m=0; const keys=[...chunks.keys()].sort((a,b)=>a-b);
  const lastK=keys[keys.length-1];
  for(const ci of keys.concat([lastK+1])){ if(m>=ta.count-1) break; const a=S(ci*SPC); if(!a) continue;
    const w= ci===lastK+1?60:24; const col= ci===lastK+1?[3,0.3,0.3]:[0.9,0.9,1.0];
    ta.position.setXYZ(m,a.x-a.rx*w,a.y+4,a.z-a.rz*w); ta.color.setXYZ(m,...col); m++;
    ta.position.setXYZ(m,a.x+a.rx*w,a.y+4,a.z+a.rz*w); ta.color.setXYZ(m,...col); m++; }
  dbg.ticks.geometry.setDrawRange(0,m); ta.position.needsUpdate=true; ta.color.needsUpdate=true;
  const sec=f.sec; const nextSecs=sections.filter(q=>q.end>ego.s).slice(0,4);
  const sw=t=>`<span class="sw" style="background:rgb(${SEC_COL[t].map(v=>Math.round(Math.min(1,v)*255)).join(',')})"></span>`;
  dbg.el.innerHTML=
`<b>俯瞰デバッグ</b>   ドラッグ: 回転 / ホイール: ズーム / B: 戻る
走行距離   ${(ego.s/1000).toFixed(2)} km    速度 ${(ego.v*3.6).toFixed(0)} km/h    車線 ${ego.lane?'追越':'走行'}
現在区間   ${sw(sec.type)}${SEC_JP[sec.type]}  ${Math.round(f.ls)} / ${sec.len} m
生成済み   チャンク ${chunks.size} 個 (${CH}m 単位)  後方 ${BEHIND}m 〜 前方 ${AHEAD}m
道路データ 前方 ${Math.round((P.first+P.arr.length)*STEP-ego.s)} m 先まで
車両       ${cars.filter(c=>c.dir>0).length} 台 同方向 / ${cars.filter(c=>c.dir<0).length} 台 対向
天気       雨 ${(state.rain*100).toFixed(0)}%  路面 ${(state.wet*100).toFixed(0)}%
FPS        ${dbg.fps.toFixed(0)}
この先     ${nextSecs.map(q=>sw(q.type)+SEC_JP[q.type]+' '+((q.start-ego.s)>0?'+'+Math.round(q.start-ego.s)+'m':'走行中')).join('   ')}
<span style="opacity:.6">白線 = チャンク境界 / 赤線 = 生成の最前線 / 暗い線 = 生成待ちの道路</span>`;
}

/* ============================================================
   boot
   ============================================================ */
function resize(){
  const w=innerWidth,h=innerHeight;
  renderer.setPixelRatio(PR); renderer.setSize(w,h);
  camera.aspect=w/h; camera.updateProjectionMatrix(); icam.aspect=w/h; icam.updateProjectionMatrix();
  if(composer){ composer.setPixelRatio(PR); composer.setSize(w,h); }
  if(reflRT) reflRT.setSize(Math.round(w*PR*0.5),Math.round(h*PR*0.5));
  if(gradePass) gradePass.uniforms.uRes.value.set(w*PR,h*PR);
  U.pr.value=PR;
}
addEventListener('resize',resize);
async function boot(){
  try{ await Promise.race([Promise.all([document.fonts.load(`700 40px "Noto Sans JP"`),document.fonts.load(`900 40px "Noto Sans JP"`),document.fonts.load(`400 40px "Noto Sans JP"`)]),new Promise(r=>setTimeout(r,2500))]); }catch(e){}
  makeBaseTextures(); makeSignTextures(); makeMaterials(); makeSharedGeometry();
  makeWorld(); makeTraffic(); makeRain(); makeInterior(); makePost(); makeDebug();
  reflRT=new THREE.WebGLRenderTarget(Math.round(innerWidth*PR*0.5),Math.round(innerHeight*PR*0.5),{type:THREE.HalfFloatType});
  resize();
  ensurePath(ego.s+AHEAD+1100);
  const cA=Math.floor((ego.s-BEHIND)/CH), cB=Math.floor((ego.s+AHEAD)/CH);
  for(let ci=Math.max(0,cA);ci<=cB;ci++) chunks.set(ci,buildChunk(ci));
  for(const c of chunks.values()) c.born=-10;
  // seed traffic
  for(let i=0;i<12;i++){ const lane=i%2; newCar(1,lane,ego.s+60+i*85+rr(-15,15),(lane?21:18.5)+rr(-1,1)); }
  for(let i=0;i<10;i++){ newCar(-1,i%2,ego.s+80+i*140+rr(-20,20),rr(18,22)); }
  waterNear=waterPoints();
  if(params.has('rain')){ state.weatherMode='rain'; state.rain=0.9; state.wet=1; document.getElementById('bWeather').textContent='天気: 雨'; }
  if(params.has('skip')) { const s=parseFloat(params.get('skip')); ego.s=s; ensurePath(ego.s+AHEAD+1100); for(const c of chunks.values()) disposeChunk(c); chunks.clear(); cars.length=0;
    const cA2=Math.floor((ego.s-BEHIND)/CH), cB2=Math.floor((ego.s+AHEAD)/CH); for(let ci=cA2;ci<=cB2;ci++) chunks.set(ci,buildChunk(ci)); for(const c of chunks.values()) c.born=-10; waterNear=waterPoints(); }
  if(params.has('clean')) setView('clean');
  if(params.has('debug')) setDebug(true);
  window.__pathArr=()=>P.arr; window.__dbg={ego,sections,state,cars,chunks,U,renderer,scene};
  const go=document.getElementById('go'); go.disabled=false; go.textContent='▶  出発';
  let last=performance.now()/1000;
  const loop=()=>{ requestAnimationFrame(loop); const now=performance.now()/1000; const dt=Math.min(0.05,now-last); last=now; update(dt); render(); };
  if(params.has('frames')){ // deterministic stepping for testing
    const n=parseInt(params.get('frames')); for(let i=0;i<n;i++) update(1/30); render(); window.__ready=true;
    window.__step=(k,d=1/30)=>{ for(let i=0;i<k;i++) update(d); render(); };
  } else loop();
}
function setView(v){ state.view=v; interiorPass.enabled=v==='interior'&&!dbg.on; document.getElementById('bView').textContent= v==='interior'?'視点: 車内':'視点: ダッシュカム'; if(v!=='interior') drops=[]; }
document.getElementById('go').addEventListener('click',()=>{
  document.getElementById('start').classList.add('gone'); running=true;
  try{ sound.start(); sound.setVolume(parseFloat(document.getElementById('vol').value)); }catch(e){}
});
const panel=document.getElementById('panel'); let idleT;
function poke(){ panel.classList.remove('idle'); document.body.classList.remove('hidecursor'); clearTimeout(idleT); idleT=setTimeout(()=>{panel.classList.add('idle'); document.body.classList.add('hidecursor');},2600); }
addEventListener('mousemove',poke); addEventListener('touchstart',poke);
const WM=['auto','clear','rain'], WL={auto:'天気: 自動',clear:'天気: 晴れ',rain:'天気: 雨'};
function cycleWeather(){ const i=(WM.indexOf(state.weatherMode)+1)%3; state.weatherMode=WM[i]; document.getElementById('bWeather').textContent=WL[state.weatherMode]; if(state.weatherMode==='auto'){state.weatherT=rr(60,180);} }
function toggleFull(){ try{ if(document.fullscreenElement) document.exitFullscreen(); else document.documentElement.requestFullscreen(); }catch(e){} }
function toggleQual(){ quality= quality==='high'?'low':'high'; PR= quality==='high'?Math.min(window.devicePixelRatio||1,1.5):1; document.getElementById('bQual').textContent= quality==='high'?'画質: 高':'画質: 低'; resize(); }
document.getElementById('bWeather').onclick=cycleWeather;
document.getElementById('bView').onclick=()=>setView(state.view==='interior'?'clean':'interior');
document.getElementById('bQual').onclick=toggleQual;
document.getElementById('bFull').onclick=toggleFull;
document.getElementById('bDebug').onclick=()=>setDebug(!dbg.on);
document.getElementById('vol').oninput=e=>sound.setVolume(parseFloat(e.target.value));
addEventListener('keydown',e=>{ const k=e.key.toLowerCase();
  if(k==='f') toggleFull(); else if(k==='r') cycleWeather(); else if(k==='v') setView(state.view==='interior'?'clean':'interior'); else if(k==='m') sound.toggleMute(); else if(k==='b') setDebug(!dbg.on); else if(k==='h') panel.classList.add('idle'); });
boot();
</script>
